function validate(raw){if(!raw||raw.version!==3||!raw.theme||!Array.isArray(raw.blocks)||raw.blocks.length>50||!Array.isArray(raw.socials)||raw.socials.length>12)throw Error('Geçerli bir EKİN bağlantı sayfası tasarımı seçin.');const clean={version:3,revision:typeof raw.revision==='string'?raw.revision.slice(0,100):'imported'};for(const k of ['name','bio','logo','cover','footer']){if(typeof raw[k]!=='string'||raw[k].length>(['logo','cover'].includes(k)?2800000:6000))throw Error('Profil içeriği geçersiz.');clean[k]=raw[k];}for(const k of ['logo','cover'])if(clean[k]&&!safeURL(clean[k],true))throw Error('Görsel adresi geçersiz.');clean.theme={};for(const k of ['primary','secondary','text','background']){if(!/^#[a-f0-9]{6}$/i.test(raw.theme[k]))throw Error('Renk biçimi geçersiz.');clean.theme[k]=raw.theme[k];}if(!/^#[a-f0-9]{6}([a-f0-9]{2})?$/i.test(raw.theme.button))throw Error('Buton rengi geçersiz.');clean.theme.button=raw.theme.button;clean.theme.preset=['gradient','paper','midnight'].includes(raw.theme.preset)?raw.theme.preset:'gradient';for(const [k,min,max] of [['radius',0,40],['gap',6,30],['fontSize',12,22]]){const n=Number(raw.theme[k]);if(!Number.isFinite(n)||n<min||n>max)throw Error('Tasarım ölçüsü geçersiz.');clean.theme[k]=n;}clean.contact={};for(const k of ['name','phone','email','website'])clean.contact[k]=typeof raw.contact?.[k]==='string'?raw.contact[k].slice(0,1000):'';const ids=new Set();clean.blocks=raw.blocks.map(b=>{if(!blockTypes[b.type]||typeof b.id!=='string'||!/^[-a-z0-9]{1,90}$/i.test(b.id)||ids.has(b.id)||typeof b.visible!=='boolean')throw Error('Widget bilgisi geçersiz.');ids.add(b.id);const item={id:b.id,type:b.type,visible:b.visible};for(const k of ['title','description','url','image']){item[k]=typeof b[k]==='string'?b[k]:'';if(item[k].length>(k==='image'?2800000:6000))throw Error('Widget çok büyük.');}if(item.type==='link'&&item.url&&!safeURL(item.url))throw Error('Bağlantı adresi geçersiz.');if(item.image&&!safeURL(item.image,true))throw Error('Görsel adresi geçersiz.');return item;});clean.socials=raw.socials.map(s=>{if(!socialNames[s.type]||typeof s.url!=='string'||s.url.length>2000||(s.url&&!safeURL(s.url)))throw Error('Sosyal bağlantı geçersiz.');return {type:s.type,url:s.url};});return clean;}

function renderPanel(){const panel=$('panel');if(tab==='content')renderContent(panel);if(tab==='design')renderDesignPanel(panel);if(tab==='share')renderSharePanel(panel);}
function renderContent(panel){panel.innerHTML=`<div class="upload-row"><div class="upload-preview">${design.logo?`<img src="${esc(design.logo)}" alt="Logo önizlemesi">`:logo()}</div><div><strong>Kurumsal kimliğiniz</strong><small>Kendi logonuzu yükleyerek başlayın.</small></div></div><div class="field-row"><label class="field"><span>Logo yükle</span><input type="file" data-profile-upload="logo" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG, WebP · En fazla 2 MB</small></label><label class="field"><span>Kapak görseli</span><input type="file" data-profile-upload="cover" accept="image/png,image/jpeg,image/webp"><small>İsteğe bağlı</small></label></div><div class="editor-buttons" style="display:flex;gap:7px;margin-bottom:18px">${design.logo?'<button class="ui-button soft" data-remove-image="logo">Logoyu kaldır</button>':''}${design.cover?'<button class="ui-button soft" data-remove-image="cover">Kapağı kaldır</button>':''}</div>${field('Firma adı','name',design.name)}${field('Tanıtım yazısı','bio',design.bio,true)}<div class="section-label">Sosyal medya <small>Yalnızca eklediğiniz adresler görünür</small></div><div id="social-editors">${design.socials.map((s,i)=>`<div class="social-editor"><select aria-label="Sosyal medya türü ${i+1}" data-social-type="${i}">${Object.entries(socialNames).map(([k,v])=>`<option value="${k}" ${s.type===k?'selected':''}>${v}</option>`).join('')}</select><input aria-label="Sosyal medya adresi ${i+1}" data-social-url="${i}" value="${esc(s.url)}" placeholder="https://…"><button data-social-remove="${i}" aria-label="Sosyal bağlantıyı sil">×</button></div>`).join('')}</div><button class="ui-button soft" id="add-social">${icon('plus')} Sosyal bağlantı ekle</button><div class="section-label">Bağlantılar ve widget’lar <small>${design.blocks.length} öğe</small></div><div id="block-editors">${design.blocks.length?design.blocks.map((b,i)=>blockEditorMarkup(b,i)).join(''):'<div class="empty-editor">İlk bağlantınızı aşağıdaki düğmelerle ekleyin.</div>'}</div><div class="add-types">${Object.entries(blockTypes).map(([k,v])=>`<button data-add="${k}">${icon(typeIcon[k])}${v}</button>`).join('')}</div><div class="section-label">Kartvizit bilgileri <small>Rehbere kaydedilecek bilgiler</small></div>${field('Kartvizit adı','contact.name',design.contact.name)}${field('Kartvizit telefonu','contact.phone',design.contact.phone)}${field('Kartvizit e-postası','contact.email',design.contact.email)}${field('Kartvizit web sitesi','contact.website',design.contact.website)}${field('Alt bilgi','footer',design.footer)}<div class="help-note">Bağlantıları oklarla veya tutma alanından sürükleyerek sıralayın. Göz simgesiyle gizleyin. Telefon ve e-posta alanlarına yalnızca numara ve adresi yazın.</div>`;bindFields(panel);panel.querySelectorAll('[data-profile-upload]').forEach(input=>input.onchange=()=>uploadImage(input,src=>{design[input.dataset.profileUpload]=src;changed(true);renderPanel();}));panel.querySelectorAll('[data-remove-image]').forEach(b=>b.onclick=()=>{saveHistory();design[b.dataset.removeImage]='';changed(true);renderPanel();});$('add-social').onclick=()=>{if(design.socials.length>=12){toast('En fazla 12 sosyal bağlantı eklenebilir.');return;}saveHistory();design.socials.push({type:'instagram',url:''});changed(true);renderPanel();};panel.querySelectorAll('[data-social-type]').forEach(input=>input.onchange=()=>{saveHistory();design.socials[Number(input.dataset.socialType)].type=input.value;changed(true);});panel.querySelectorAll('[data-social-url]').forEach(input=>input.oninput=()=>{if(input.value&&!safeURL(input.value)){input.setCustomValidity('Geçerli bir bağlantı adresi yazın.');return;}input.setCustomValidity('');design.socials[Number(input.dataset.socialUrl)].url=input.value;changed();});panel.querySelectorAll('[data-social-remove]').forEach(b=>b.onclick=()=>{saveHistory();design.socials.splice(Number(b.dataset.socialRemove),1);changed(true);renderPanel();});panel.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(design.blocks.length>=50){toast('En fazla 50 öğe eklenebilir.');return;}saveHistory();const type=b.dataset.add;const block={id:uid(),type,title:{link:'Yeni bağlantı',phone:'Bizi arayın',email:'Bize yazın',whatsapp:'WhatsApp ile iletişime geç',vcard:'Kartviziti kaydet',heading:'Yeni başlık',text:'',image:'Görsel açıklaması',divider:''}[type],description:type==='text'?'Metninizi buraya yazın.':'',url:'',image:'',visible:true};design.blocks.push(block);openBlock=block.id;changed(true);renderPanel();panel.querySelector(`[data-block="${block.id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});});bindBlockEditors(panel);}
function blockEditorMarkup(b,i){const open=openBlock===b.id;let fields='';if(!['divider','text'].includes(b.type))fields+=field(b.type==='image'?'Görsel açıklaması':'Görünen başlık','block.'+b.id+'.title',b.title);if(['link','phone','email','whatsapp'].includes(b.type))fields+=field({link:'Bağlantı adresi',phone:'Telefon numarası',email:'E-posta adresi',whatsapp:'WhatsApp numarası (ülke koduyla)'}[b.type],'block.'+b.id+'.url',b.url);if(['link','phone','email','whatsapp','vcard','text'].includes(b.type))fields+=field(b.type==='text'?'Metin':'Alt açıklama','block.'+b.id+'.description',b.description,b.type==='text');if(b.type==='image')fields+=`<label class="field"><span>Görsel yükle</span><input type="file" data-block-upload="${b.id}" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG, WebP · En fazla 2 MB</small></label>`+field('Görsel adresi (isteğe bağlı)','block.'+b.id+'.image',b.image.startsWith('data:')?'':b.image);return `<div class="block-editor ${b.visible?'':'is-hidden'}" data-block="${b.id}" draggable="true"><div class="block-top"><span class="drag-grip" title="Sürükleyerek taşıyın">⠿</span><button class="block-open" data-open="${b.id}" aria-expanded="${open}" aria-label="${esc(b.title||blockTypes[b.type])} düzenle">${icon(typeIcon[b.type])}<span>${esc(b.title||blockTypes[b.type])}</span></button><button class="icon-button" data-visible="${b.id}" aria-label="${esc(b.title||blockTypes[b.type])} ${b.visible?'gizle':'göster'}">${icon(b.visible?'eye':'plus')}</button></div>${open?`<div class="block-fields">${fields||'<p class="help-note">Bölümleri ayıran ince bir çizgi.</p>'}</div><div class="block-actions"><button data-move="${b.id}" data-direction="-1" ${i===0?'disabled':''}>↑ Yukarı</button><button data-move="${b.id}" data-direction="1" ${i===design.blocks.length-1?'disabled':''}>↓ Aşağı</button><button data-duplicate="${b.id}">Kopyala</button><button class="delete" data-delete="${b.id}">Sil</button></div>`:''}</div>`;}
function bindFields(panel){panel.querySelectorAll('[data-field]').forEach(input=>input.oninput=()=>{const path=input.dataset.field.split('.');if(path[0]==='block'){const b=design.blocks.find(x=>x.id===path[1]);const key=path[2];if((key==='url'&&b.type==='link'||key==='image')&&input.value&&!safeURL(input.value,key==='image')){input.setCustomValidity('Geçerli bir adres yazın.');return;}input.setCustomValidity('');b[key]=input.value;if(key==='title'){const label=panel.querySelector(`[data-open="${b.id}"] span`);if(label)label.textContent=input.value||blockTypes[b.type];}}else if(path[0]==='contact')design.contact[path[1]]=input.value;else design[path[0]]=input.value;changed();});}
function bindBlockEditors(panel){panel.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openBlock=openBlock===b.dataset.open?'':b.dataset.open;saveHistory();renderPanel();});panel.querySelectorAll('[data-visible]').forEach(b=>b.onclick=()=>{saveHistory();const item=design.blocks.find(x=>x.id===b.dataset.visible);item.visible=!item.visible;changed(true);renderPanel();});panel.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const i=design.blocks.findIndex(x=>x.id===b.dataset.move),next=i+Number(b.dataset.direction);if(next<0||next>=design.blocks.length)return;saveHistory();[design.blocks[i],design.blocks[next]]=[design.blocks[next],design.blocks[i]];changed(true);renderPanel();});panel.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{saveHistory();design.blocks=design.blocks.filter(x=>x.id!==b.dataset.delete);changed(true);renderPanel();toast('Öğe silindi. Geri al ile geri getirebilirsiniz.');});panel.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>{if(design.blocks.length>=50)return;saveHistory();const i=design.blocks.findIndex(x=>x.id===b.dataset.duplicate);const copy={...design.blocks[i],id:uid()};design.blocks.splice(i+1,0,copy);openBlock=copy.id;changed(true);renderPanel();});panel.querySelectorAll('[data-block-upload]').forEach(input=>input.onchange=()=>uploadImage(input,src=>{const b=design.blocks.find(x=>x.id===input.dataset.blockUpload);if(!b)return;b.image=src;changed(true);toast('Görsel eklendi.');}));panel.querySelectorAll('[data-block]').forEach(row=>{row.addEventListener('dragstart',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();return;}e.dataTransfer.setData('text/plain',row.dataset.block);});row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drop-target');});row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drop-target');const from=design.blocks.findIndex(x=>x.id===e.dataTransfer.getData('text/plain')),to=design.blocks.findIndex(x=>x.id===row.dataset.block);if(from<0||from===to)return;saveHistory();const [item]=design.blocks.splice(from,1);design.blocks.splice(to,0,item);changed(true);renderPanel();});});}
function uploadImage(input,callback){const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){toast('En fazla 2 MB boyutunda PNG, JPG veya WebP seçin.');return;}const reader=new FileReader();reader.onload=()=>{if(!safeURL(reader.result,true)){toast('Görsel okunamadı.');return;}saveHistory();callback(reader.result);};reader.onerror=()=>toast('Görsel okunamadı.');reader.readAsDataURL(file);}
function renderDesignPanel(panel){panel.innerHTML=`<div class="section-label">Hazır tasarımlar <small>Bir stille başlayın</small></div><div class="preset-grid">${[['gradient','Kurumsal',''],['paper','Sade','white'],['midnight','Gece','dark']].map(([key,name,css])=>`<button class="preset ${design.theme.preset===key?'selected':''}" data-preset="${key}" aria-label="${name} tasarımı"><div class="preset-preview ${css}"><i></i><span></span><span></span><span></span></div><strong>${name}</strong></button>`).join('')}</div><div class="section-label">Markanızın renkleri</div>${[['primary','Ana renk'],['secondary','Geçiş rengi'],['text','Yazı rengi'],['button','Buton rengi'],['background','Sayfa arka planı']].map(([key,label])=>`<label class="color-row"><span>${label}</span><span class="color-value"><input type="color" aria-label="${label}" data-color="${key}" value="${design.theme[key].slice(0,7)}"><code id="color-${key}">${design.theme[key]}</code></span></label>`).join('')}<label class="field"><span>Buton saydamlığı <output id="opacity-value" class="range-label">${Math.round((design.theme.button.length===9?parseInt(design.theme.button.slice(7),16)/255:1)*100)}%</output></span><input type="range" aria-label="Buton saydamlığı" id="button-opacity" min="10" max="100" value="${Math.round((design.theme.button.length===9?parseInt(design.theme.button.slice(7),16)/255:1)*100)}"></label><div class="section-label">Boyut ve boşluklar</div>${[['fontSize','Yazı boyutu',12,22],['radius','Köşe yuvarlaklığı',0,40],['gap','Bağlantılar arası boşluk',6,30]].map(([key,label,min,max])=>`<label class="field"><span>${label}<output class="range-label" id="range-${key}">${design.theme[key]} px</output></span><input type="range" aria-label="${label}" data-range="${key}" min="${min}" max="${max}" value="${design.theme[key]}"></label>`).join('')}<div class="help-note">Sayfanız mobil ekranlara otomatik uyum sağlar. Renkler ve boyutlar, tüm bağlantılarınıza birlikte uygulanır.</div>`;panel.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{saveHistory();const preset=b.dataset.preset;Object.assign(design.theme,preset==='paper'?{preset,primary:'#ffffff',secondary:'#ffffff',text:'#202f74',button:'#e9edff',background:'#f2f4fa',radius:35}:preset==='midnight'?{preset,primary:'#17212f',secondary:'#17212f',text:'#f0f5ff',button:'#ffffff12',background:'#0d121b',radius:12}:{preset,primary:'#1d478d',secondary:'#dc102a',text:'#ffffff',button:'#ffffff26',background:'#f3f5f8',radius:18});changed(true);renderPanel();});panel.querySelectorAll('[data-color]').forEach(input=>input.oninput=()=>{const key=input.dataset.color;design.theme[key]=key==='button'?input.value+(design.theme.button.length===9?design.theme.button.slice(7):''):input.value;$('color-'+key).textContent=design.theme[key];changed();});panel.querySelectorAll('[data-range]').forEach(input=>input.oninput=()=>{const key=input.dataset.range;design.theme[key]=Number(input.value);$('range-'+key).textContent=input.value+' px';changed();});$('button-opacity').oninput=e=>{const alpha=Math.round(Number(e.target.value)/100*255).toString(16).padStart(2,'0');design.theme.button=design.theme.button.slice(0,7)+alpha;$('opacity-value').textContent=e.target.value+'%';$('color-button').textContent=design.theme.button;changed();};}
function renderSharePanel(panel){panel.innerHTML=`<div class="section-label">Taslağınızı saklayın</div><p class="help-note" style="margin-top:0">Taslağı kaydet, değişiklikleri bu tarayıcıda saklar. Müşterilerinize göstermek için Yayınla düğmesinden hazır kodu GitHub’a ekleyin.</p><div style="display:flex;gap:8px;margin:16px 0;flex-wrap:wrap"><button class="ui-button primary" id="save-draft">${icon('check')} Taslağı kaydet</button><button class="ui-button" id="export-json">${icon('download')} Yedek indir</button><button class="ui-button" id="import-json">Dosyadan yükle</button><input type="file" id="json-file" accept="application/json,.json" hidden></div><div class="section-label">Müşterilerinizin bağlantısı</div><div class="share-field">${esc(customerURL())}</div><button class="ui-button soft" id="copy-customer" style="margin-top:13px">${icon('copy')} Bağlantıyı kopyala</button><p class="help-note">Bu bağlantı, tasarımınızı GitHub Pages üzerinden yayımladıktan sonra müşterilerinize göndereceğiniz adrestir. Editörün adresini göndermeyin.</p><div class="section-label">Tasarımınızı herkese gösterin</div><button class="ui-button primary" id="publish-panel">${icon('arrow')} Yayın kodunu hazırla</button><p class="help-note">Yayın kodu tek bir HTML dosyasıdır. Kurulum gerektirmez. Logonuz, görselleriniz, linkleriniz ve tasarımınız dosyanın içinde taşınır.</p><button class="ui-button" id="reset-design" style="margin-top:20px">Son yayımlanan tasarıma dön</button>`;$('save-draft').onclick=()=>{saveHistory();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(validate(design)));$('draft-status').textContent='Taslak bu tarayıcıya kaydedildi';toast('Taslak kaydedildi. Müşterileriniz için ayrıca yayımlayın.');}catch(e){toast(e.name==='QuotaExceededError'?'Tarayıcı depolaması dolu. Görselleri küçültün veya yedek indirin.':e.message);}};$('export-json').onclick=()=>{try{downloadBlob(JSON.stringify(validate(design),null,2),'application/json','ekin-baglanti-tasarimi.json');}catch(e){toast(e.message);}};$('import-json').onclick=()=>$('json-file').click();$('json-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Dosya en fazla 10 MB olabilir.');const next=validate(JSON.parse(await file.text()));saveHistory();design=next;changed(true);renderPanel();toast('Tasarım yüklendi. Yayınlamak için Yayınla’yı kullanın.');}catch(err){toast(err instanceof SyntaxError?'Geçerli bir JSON dosyası seçin.':err.message);}finally{e.target.value='';}};$('copy-customer').onclick=async()=>{if(await copyText(customerURL()))toast('Müşteri bağlantısı kopyalandı.');else window.prompt('Bağlantınızı kopyalayın:',customerURL());};$('publish-panel').onclick=preparePublish;$('reset-design').onclick=()=>{if(!confirm('Son yayımlanan tasarıma dönülsün mü? Bu işlemi geri alabilirsiniz.'))return;saveHistory();design=structuredClone(published);changed(true);renderPanel();toast('Son yayımlanan tasarım yüklendi.');};}
function buildHTML(){const clean=validate(design);clean.revision=crypto.randomUUID();const doc=new DOMParser().parseFromString(template,'text/html');doc.querySelector('#page-config').textContent=JSON.stringify(clean).replace(/</g,'\\u003c');doc.title=clean.name+' | Tüm bağlantılar';doc.querySelector('meta[name="description"]').content=clean.bio||clean.name+' — tüm bağlantılar';doc.querySelector('meta[name="theme-color"]').content=clean.theme.primary;return '<!doctype html>\n'+doc.documentElement.outerHTML;}
function preparePublish(){try{saveHistory();$('publish-code').value=buildHTML();$('publish-dialog').showModal();}catch(e){toast(e.message||'Yayın kodu hazırlanamadı.');}}
template=sourceMarkup();
if(new URLSearchParams(location.search).has('duzenle'))openEditor();else renderPublic();
document.addEventListener('keydown',e=>{if(!editing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(validate(design)));toast('Taslak bu tarayıcıya kaydedildi.');}catch{toast('Kaydedilemedi. Yedek indirmeyi deneyin.');}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$(e.shiftKey?'redo':'undo')?.click();}});
</script>
</body>
</html>
